<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AuraHealth Nexus Assistant</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  .auth-page {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
  }
  .auth-card {
    width: 340px;
    padding: 32px 28px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.05);
  }
  .auth-card h1 { font-size: 19px; margin: 0 0 4px; }
  .auth-card p.sub { font-size: 13.5px; color: var(--text-dim); margin: 0 0 22px; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-main); }
  .auth-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .auth-field input:focus { border-color: #9c9c9c; }
  .auth-submit {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--text-main);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }
  .auth-submit:hover { background: #2f2f2f; }
  .auth-toggle {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-dim);
    margin-top: 18px;
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 13.5px;
    padding: 0;
  }
  .auth-error {
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="sub" id="authSub">Sign in to AuraHealth Nexus Assistant</p>
      <div class="auth-error" id="authError"></div>
      <form id="authForm">
        <div class="auth-field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="auth-submit" type="submit" id="authSubmit">Sign in</button>
      </form>
      <div class="auth-toggle">
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleBtn">Sign up</button>
      </div>
    </div>
  </div>

<script>
  let mode = "login"; // or "signup"
  const form = document.getElementById("authForm");
  const errorEl = document.getElementById("authError");
  const submitBtn = document.getElementById("authSubmit");
  const toggleBtn = document.getElementById("toggleBtn");
  const toggleText = document.getElementById("toggleText");
  const title = document.getElementById("authTitle");
  const sub = document.getElementById("authSub");

  toggleBtn.addEventListener("click", () => {
    mode = mode === "login" ? "signup" : "login";
    errorEl.textContent = "";
    if (mode === "signup") {
      title.textContent = "Create an account";
      sub.textContent = "Get started with AuraHealth Nexus Assistant";
      submitBtn.textContent = "Sign up";
      toggleText.textContent = "Already have an account?";
      toggleBtn.textContent = "Sign in";
    } else {
      title.textContent = "Welcome back";
      sub.textContent = "Sign in to AuraHealth Nexus Assistant";
      submitBtn.textContent = "Sign in";
      toggleText.textContent = "Don't have an account?";
      toggleBtn.textContent = "Sign up";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/signup";
    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.detail || "Something went wrong.";
        return;
      }
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = "Network error. Please try again.";
    }
  });
</script>
</body>
</html>
